name: Build & Release Standalone Binary

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: |
          export NODE_OPTIONS="--max-old-space-size=4096"
          npm install --no-audit --no-fund

      - name: Build Standalone Production Gateway
        run: |
          export NEXT_TELEMETRY_DISABLED=1
          export NODE_OPTIONS="--max-old-space-size=4096"
          if [ ! -f .env ]; then cp .env.example .env; fi
          npm run build

      - name: Package Release Archive
        run: |
          mkdir -p dist/atomic-router
          cp -r .build dist/atomic-router/
          cp -r public dist/atomic-router/ 2>/dev/null || true
          cp -r open-sse dist/atomic-router/ 2>/dev/null || true
          cp package.json dist/atomic-router/
          cp .env.example dist/atomic-router/.env.example
          cp install.sh dist/atomic-router/
          cp README.md dist/atomic-router/

          cd dist
          tar -czf ../atomic-router-linux-x64.tar.gz atomic-router
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "⚡ AtomicRouter v1.0.0 Standalone Pre-Built Release"
          body: |
            ## ⚡ AtomicRouter v1.0.0 (Pre-Compiled Standalone Release)
            
            This is the pre-compiled standalone package for ultra-fast deployment on low-spec VPS (512MB - 1GB RAM).
            
            ### 🚀 1-Line Quick Install on Any VPS:
            ```bash
            curl -fsSL https://raw.githubusercontent.com/dianrestu/atomic-router/main/install.sh | bash
            ```
          files: |
            atomic-router-linux-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
