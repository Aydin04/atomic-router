name: Build & Release Standalone Binary

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Multi-Platform Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Expand Virtual Memory (Native 10GB Swap)
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile
          sudo fallocate -l 10G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=10240
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Get Package Version
        id: pkg-ver
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y zip xz-utils
          export NODE_OPTIONS="--max-old-space-size=12288"
          npm install --no-audit --no-fund

      - name: Build Standalone Production Gateway
        run: |
          export NEXT_TELEMETRY_DISABLED=1
          export NODE_OPTIONS="--max-old-space-size=12288"
          export OMNIROUTE_BUILD_MEMORY_MB="12288"
          export OMNIROUTE_USE_TURBOPACK="1"
          if [ ! -f .env ]; then cp .env.example .env; fi
          npm run build

      - name: Package Release Archives (Linux, macOS, Windows)
        run: |
          echo "Locating assembled standalone directory..."
          TARGET_DIR=".build/next/standalone"
          if [ ! -d "$TARGET_DIR" ]; then
            TARGET_DIR=$(find .build .next dist -name "standalone" -type d 2>/dev/null | head -n 1)
          fi
          
          if [ -z "$TARGET_DIR" ] || [ ! -d "$TARGET_DIR" ]; then
            echo "ERROR: Standalone directory not found!"
            exit 1
          fi

          echo "Found standalone directory: $TARGET_DIR"

          # Copy extra config and start scripts
          cp .env.example "$TARGET_DIR/.env.example" 2>/dev/null || true
          cp install.sh "$TARGET_DIR/install.sh" 2>/dev/null || true
          cp README.md "$TARGET_DIR/README.md" 2>/dev/null || true
          cp scripts/start.sh "$TARGET_DIR/start.sh" 2>/dev/null || true
          cp scripts/start.bat "$TARGET_DIR/start.bat" 2>/dev/null || true
          chmod +x "$TARGET_DIR/start.sh" 2>/dev/null || true

          # 1. Linux x64 Release
          echo "Packaging Linux Release..."
          tar -czf /tmp/atomic-router-linux-x64.tar.gz -C "$TARGET_DIR" .
          mv /tmp/atomic-router-linux-x64.tar.gz ./atomic-router-linux-x64.tar.gz

          # 2. macOS Universal Release
          echo "Packaging macOS Release..."
          tar -czf /tmp/atomic-router-macos-universal.tar.gz -C "$TARGET_DIR" .
          mv /tmp/atomic-router-macos-universal.tar.gz ./atomic-router-macos-universal.tar.gz

          # 3. Windows x64 Release
          echo "Packaging Windows Release..."
          (cd "$TARGET_DIR" && zip -r -q /tmp/atomic-router-windows-x64.zip .)
          mv /tmp/atomic-router-windows-x64.zip ./atomic-router-windows-x64.zip

          # 4. Mobile / Embedded Pruned Release (.tar.xz)
          echo "Creating Pruned Mobile / Embedded Package..."
          STAGE_PRUNED="/tmp/atomic-router-pruned"
          rm -rf "$STAGE_PRUNED"
          cp -r "$TARGET_DIR" "$STAGE_PRUNED"
          (
            cd "$STAGE_PRUNED"
            # Remove non-runtime docs, tests, source maps, typescript types
            rm -rf docs tests CHANGELOG.md CONTRIBUTING.md CODE_OF_CONDUCT.md images changelog.d contrib docker examples .git promptfooconfig.yaml playwright.config.ts stryker.* vitest.* codecov.yml sonar-project.properties Makefile Dockerfile 2>/dev/null || true
            find . -type f \( -name "*.dll" -o -name "*.dylib" -o -name "*.exe" \) -delete || true
            find node_modules -type d \( -name "win32" -o -name "darwin" -o -name "ia32" \) -exec rm -rf {} + 2>/dev/null || true
            rm -rf node_modules/promptfoo node_modules/@oven node_modules/bun node_modules/playwright node_modules/playwright-core node_modules/prettier node_modules/eslint node_modules/@eslint node_modules/vitest node_modules/c8 node_modules/knip 2>/dev/null || true
            find . -type f \( -name "*.map" -o -name "*.d.ts" -o -name "*.flow" \) -delete || true
            # Remove redundant Next.js NFT trace metadata (.nft.json) & unneeded CUDA GPU binary
            find .build -name "*.nft.json" -delete 2>/dev/null || true
            rm -f node_modules/onnxruntime-node/bin/napi-v6/linux/x64/libonnxruntime_providers_cuda.so 2>/dev/null || true
            rm -rf node_modules/typescript src 2>/dev/null || true
            find node_modules/@tensorflow \( -name "*_test.js" -o -name "*.test.js" \) -delete 2>/dev/null || true
            tar -cf - . | xz -z -9 -T0 > /tmp/atomic-router-pruned.tar.xz
          )
          mv /tmp/atomic-router-pruned.tar.xz ./atomic-router-pruned.tar.xz
          rm -rf "$STAGE_PRUNED"

          # 5. Magisk Module Package
          echo "Packaging AtomicRouter Magisk Module..."
          STAGE_MAGISK="/tmp/atomic-magisk"
          rm -rf "$STAGE_MAGISK"
          mkdir -p "$STAGE_MAGISK/atomic-router"
          
          # Copy Magisk files
          cp -r magisk-module/* "$STAGE_MAGISK/"
          
          # Bundle embedded standalone Node.js ARM64 runtime (zero-dependency, no Termux needed)
          echo "Bundling embedded Node.js ARM64 runtime..."
          mkdir -p "$STAGE_MAGISK/bin" "$STAGE_MAGISK/lib"
          STAGE_NODE="/tmp/node-arm64-stage"
          rm -rf "$STAGE_NODE"
          mkdir -p "$STAGE_NODE"
          (
            cd "$STAGE_NODE"
            BASE_TERMUX="https://grimler.se/termux/termux-main"
            curl -sL "$BASE_TERMUX/pool/main/n/nodejs/nodejs_26.4.0-1_aarch64.deb" -o nodejs.deb
            curl -sL "$BASE_TERMUX/pool/main/libc/libc++/libc++_29_aarch64.deb" -o libc++.deb
            curl -sL "$BASE_TERMUX/pool/main/libf/libffi/libffi_3.8.0_aarch64.deb" -o libffi.deb
            curl -sL "$BASE_TERMUX/pool/main/libi/libicu/libicu_78.3_aarch64.deb" -o libicu.deb
            curl -sL "$BASE_TERMUX/pool/main/libs/libsqlite/libsqlite_3.53.4_aarch64.deb" -o libsqlite.deb
            curl -sL "$BASE_TERMUX/pool/main/o/openssl/openssl_1:3.6.3_aarch64.deb" -o openssl.deb
            curl -sL "$BASE_TERMUX/pool/main/c/c-ares/c-ares_1.34.8_aarch64.deb" -o c-ares.deb
            curl -sL "$BASE_TERMUX/pool/main/z/zlib/zlib_1.3.2_aarch64.deb" -o zlib.deb
            for deb in *.deb; do
              ar x "$deb"
              tar -xf data.tar.* 2>/dev/null || true
              rm -f data.tar.* control.tar.* debian-binary "$deb"
            done
            cp -r data/data/com.termux/files/usr/bin/node "$STAGE_MAGISK/bin/" 2>/dev/null || true
            cp -P data/data/com.termux/files/usr/lib/lib* "$STAGE_MAGISK/lib/" 2>/dev/null || true
          )
          rm -rf "$STAGE_NODE"
          chmod +x "$STAGE_MAGISK/bin/node" || true

          # Compute version code
          RAW_VER="${{ steps.pkg-ver.outputs.version }}"
          CLEAN_VER=$(echo "$RAW_VER" | tr -cd '0-9')
          if [ -z "$CLEAN_VER" ]; then CLEAN_VER="1000"; fi
          
          # Update module.prop and update.json dynamically
          cat << 'EOF' > "$STAGE_MAGISK/module.prop"
          id=atomic_router
          name=AtomicRouter Magisk Module
          author=Aydin04
          description=Run AtomicRouter background service on Android with low-RAM limits (~128MB). Accessible at http://127.0.0.1:20128
          updateJson=https://raw.githubusercontent.com/Aydin04/atomic-router/main/magisk-module/update.json
          EOF
          sed -i "s/^[ \t]*//" "$STAGE_MAGISK/module.prop"
          echo "version=v${{ steps.pkg-ver.outputs.version }}" >> "$STAGE_MAGISK/module.prop"
          echo "versionCode=$CLEAN_VER" >> "$STAGE_MAGISK/module.prop"

          cat << 'EOF' > "$STAGE_MAGISK/update.json"
          {
            "zipUrl": "https://github.com/Aydin04/atomic-router/releases/latest/download/atomic-router-magisk.zip",
            "changelog": "https://raw.githubusercontent.com/Aydin04/atomic-router/main/magisk-module/changelog.md"
          }
          EOF
          sed -i "s/^[ \t]*//" "$STAGE_MAGISK/update.json"
          jq --arg v "v${{ steps.pkg-ver.outputs.version }}" --argjson vc "$CLEAN_VER" '.version = $v | .versionCode = $vc' "$STAGE_MAGISK/update.json" > /tmp/uj.json && mv /tmp/uj.json "$STAGE_MAGISK/update.json"
          
          # Copy updated update.json back to repo so raw URL stays up to date
          cp "$STAGE_MAGISK/update.json" magisk-module/update.json
          cp "$STAGE_MAGISK/module.prop" magisk-module/module.prop

          # Copy all standalone files including hidden folders (.build) into temporary folder
          STAGE_APP="/tmp/atomic-app-stage"
          rm -rf "$STAGE_APP"
          mkdir -p "$STAGE_APP"
          tar -C "$TARGET_DIR" -cf - . | tar -C "$STAGE_APP/" -xf -
          (
            cd "$STAGE_APP"
            rm -rf docs tests CHANGELOG.md CONTRIBUTING.md CODE_OF_CONDUCT.md images changelog.d contrib docker examples .git promptfooconfig.yaml playwright.config.ts stryker.* vitest.* codecov.yml sonar-project.properties Makefile Dockerfile 2>/dev/null || true
            find . -type f \( -name "*.dll" -o -name "*.dylib" -o -name "*.exe" \) -delete || true
            find node_modules -type d \( -name "win32" -o -name "darwin" -o -name "ia32" \) -exec rm -rf {} + 2>/dev/null || true
            rm -rf node_modules/promptfoo node_modules/@oven node_modules/bun node_modules/playwright node_modules/playwright-core node_modules/prettier node_modules/eslint node_modules/@eslint node_modules/vitest node_modules/c8 node_modules/knip 2>/dev/null || true
            find . -type f \( -name "*.map" -o -name "*.d.ts" -o -name "*.flow" \) -delete || true
            # Aggressively prune desktop AI engines, unused native binaries to hit ~100MB
            rm -rf node_modules/@tensorflow node_modules/onnxruntime-node node_modules/@ngrok 2>/dev/null || true
            rm -rf node_modules/wreq-js/rust/*darwin* node_modules/wreq-js/rust/*win32* 2>/dev/null || true
            rm -rf .build/next/node_modules/wreq-js*/rust/*darwin* .build/next/node_modules/wreq-js*/rust/*win32* 2>/dev/null || true
            rm -rf node_modules/better-sqlite3/prebuilds/*darwin* node_modules/better-sqlite3/prebuilds/*win32* 2>/dev/null || true
            rm -rf .build/next/node_modules/better-sqlite3*/prebuilds/*darwin* .build/next/node_modules/better-sqlite3*/prebuilds/*win32* 2>/dev/null || true
            rm -rf node_modules/koffi/build/*darwin* node_modules/koffi/build/*win32* 2>/dev/null || true
            rm -rf node_modules/@img/sharp-libvips-darwin* node_modules/@img/sharp-libvips-win32* 2>/dev/null || true
            rm -f node_modules/onnxruntime-web/dist/*.wasm 2>/dev/null || true
            rm -f node_modules/@huggingface/transformers/dist/*.wasm 2>/dev/null || true
            rm -f .build/next/node_modules/@huggingface/transformers*/dist/*.wasm 2>/dev/null || true
            
            # Ultra-compress with XZ Level 9 (Multi-threaded)
            echo "Compressing atomic-router payload into atomic-router.tar.xz..."
            mkdir -p atomic-router
            find . -mindepth 1 -maxdepth 1 ! -name atomic-router -exec mv {} atomic-router/ \;
            tar -cf - atomic-router | xz -z -9 -T0 > "$STAGE_MAGISK/atomic-router.tar.xz"
          )
          rm -rf "$STAGE_APP"
          
          # Create Magisk zip (only contains installer scripts, node bin/lib, and atomic-router.tar.xz)
          (cd "$STAGE_MAGISK" && zip -r -9 /tmp/atomic-router-magisk.zip .)
          mv /tmp/atomic-router-magisk.zip ./atomic-router-magisk.zip
          rm -rf "$STAGE_MAGISK"

          # Commit updated update.json to repo if changed
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add magisk-module/update.json magisk-module/module.prop magisk-module/customize.sh || true
          git commit -m "chore(magisk): update module version to v${{ steps.pkg-ver.outputs.version }}" || true
          git push origin main || true

          ls -lh atomic-router-*.tar.gz atomic-router-*.zip atomic-router-*.tar.xz atomic-router-magisk.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ steps.pkg-ver.outputs.version }}
          name: "⚡ AtomicRouter v${{ steps.pkg-ver.outputs.version }} Multi-Platform Standalone Release"
          body: |
            ## ⚡ AtomicRouter v${{ steps.pkg-ver.outputs.version }} Multi-Platform Standalone Release
            
            Ultra-Lightweight Universal AI Gateway & Smart Proxy (Linux, macOS, Windows, Android Magisk Module / Termux).
            
            ### 📱 Magisk / KernelSU / APatch Module:
            - Download `atomic-router-magisk.zip` and flash in Magisk app / KernelSU!
            - Runs in the background on boot with strict 128MB RAM limit.
            - Web Dashboard: `http://127.0.0.1:20128/`
            - Native updates supported via Magisk Manager!
            
            ### 🚀 1-Line Quick Install on Linux / VPS:
            ```bash
            curl -fsSL https://raw.githubusercontent.com/Aydin04/atomic-router/main/install.sh | bash
            ```
            
            ### 📱 Android / Embedded / DSH Harness:
            Download `atomic-router-pruned.tar.xz`.
            
            ### 🪟 Windows (No Build Required):
            1. Download `atomic-router-windows-x64.zip`
            2. Extract to a folder
            3. Double click `start.bat` (Opens at `http://localhost:20128/`)
            
            ### 🍎 macOS (Intel / Apple Silicon):
            1. Download `atomic-router-macos-universal.tar.gz`
            2. Extract: `tar -xzf atomic-router-macos-universal.tar.gz`
            3. Run: `./start.sh` (Opens at `http://localhost:20128/`)
          files: |
            atomic-router-linux-x64.tar.gz
            atomic-router-macos-universal.tar.gz
            atomic-router-windows-x64.zip
            atomic-router-pruned.tar.xz
            atomic-router-magisk.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
