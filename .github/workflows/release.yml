name: Build & Release Standalone Binary

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: |
          export NODE_OPTIONS="--max-old-space-size=4096"
          npm install --no-audit --no-fund

      - name: Build Standalone Production Gateway
        run: |
          export NEXT_TELEMETRY_DISABLED=1
          export NODE_OPTIONS="--max-old-space-size=4096"
          if [ ! -f .env ]; then cp .env.example .env; fi
          npm run build

      - name: Package Release Archive
        run: |
          echo "Packaging standalone bundle..."
          TARGET_DIR=".build/standalone"
          if [ ! -d "$TARGET_DIR" ]; then
            TARGET_DIR="."
          fi

          # Prune cache and sourcemaps
          find "$TARGET_DIR" -type d -name "cache" -exec rm -rf {} + 2>/dev/null || true
          find "$TARGET_DIR" -type f -name "*.map" -delete 2>/dev/null || true

          # Copy extra config files into standalone bundle
          cp .env.example "$TARGET_DIR/.env.example" 2>/dev/null || true
          cp install.sh "$TARGET_DIR/install.sh" 2>/dev/null || true
          cp README.md "$TARGET_DIR/README.md" 2>/dev/null || true

          # Safe tar archive written to /tmp first (prevents tar self-read loop)
          tar --exclude='*.tar.gz' --exclude='*/cache/*' --exclude='*.map' -czf /tmp/atomic-router-linux-x64.tar.gz -C "$TARGET_DIR" .
          mv /tmp/atomic-router-linux-x64.tar.gz ./atomic-router-linux-x64.tar.gz
          ls -lh atomic-router-linux-x64.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v3.8.50
          name: "⚡ AtomicRouter v3.8.50 Standalone Release"
          body: |
            ## ⚡ AtomicRouter v3.8.50 (Pre-Compiled Standalone Release)
            
            Pure Gateway Fork of OmniRoute v3.8.50 (330+ Providers, Combos, Proxy Pool & Stream Compression).
            
            ### 🚀 1-Line Quick Install on Any VPS:
            ```bash
            curl -fsSL https://raw.githubusercontent.com/dianrestu/atomic-router/main/install.sh | bash
            ```
            
            ### ⚡ Update Command (For Existing Installations):
            ```bash
            sudo atomic-router update
            ```
          files: |
            atomic-router-linux-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
